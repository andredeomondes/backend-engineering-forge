services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_local_only
      POSTGRES_DB: forge_sql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_sql"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - forge-sql-data:/var/lib/postgresql/data
      - ./:/workspace:ro

volumes:
  forge-sql-data:

